# Shared build config so the app/reverb/queue images (same Dockerfile) build
# once with identical args. The VITE_* values are read from .env via compose
# interpolation and baked into the frontend bundle at build time.
x-app-build: &app-build
  context: .
  args:
    VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}

services:
  app:
    build: *app-build
    env_file: .env
    restart: unless-stopped
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}
    restart: unless-stopped
    ports:
      # Bind to loopback only — the public-facing host Caddy proxies to this.
      # Never expose the plain-HTTP app directly on the VPS's public IP.
      - "127.0.0.1:8080:80"
    volumes:
      # Share the uploads volume with the app so Caddy can serve /storage/*.
      - storage:/var/www/html/storage/app
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  reverb:
    build: *app-build
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    restart: unless-stopped
    ports:
      # Loopback only; host Caddy proxies /app/* here for websockets.
      - "127.0.0.1:8082:8080"
    depends_on:
      - app

  queue:
    build: *app-build
    command: php artisan queue:work --tries=3
    env_file: .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  storage:
